[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-passport"
version = "0.1.0"
description = "Schema, validator, and signer for MODEL_PASSPORT.json / SIGNOFF.json. Post-train integrity + feeding-contract artifacts for trained robotics policy checkpoints, generated before the checkpoint moves anywhere (HF upload, eval, deploy)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "alpha-robotics"}]
# RoboCandyWrapper is a normal dependency because OpenPI reference extraction
# must handle mixed LeRobot dataset versions through the sanctioned workflow.
dependencies = [
  "robocandywrapper>=0.2.14",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
validate-checkpoint = "checkpoint_passport.cli.validate:main"
sign-checkpoint = "checkpoint_passport.cli.sign:main"
generate-passport = "checkpoint_passport.cli.generate:main"
extract-passport-seed = "checkpoint_passport.cli.extract_passport_seed:main"
assemble-passport = "checkpoint_passport.cli.assemble_passport:main"
check-publish-ready = "checkpoint_passport.cli.check_publish_ready:main"
publish-checkpoint = "checkpoint_passport.cli.publish_checkpoint:main"

[tool.setuptools.packages.find]
include = ["checkpoint_passport*"]
exclude = ["tests*"]
