[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-integrity"
version = "0.1.0"
description = "Fast SHA-256 manifest generation and verification for checkpoint bundles."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "alpha-robotics"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
manifest-checkpoint = "checkpoint_integrity.cli:manifest_main"
verify-checkpoint = "checkpoint_integrity.cli:verify_main"

[tool.setuptools.packages.find]
include = ["checkpoint_integrity*"]
exclude = ["tests*"]
